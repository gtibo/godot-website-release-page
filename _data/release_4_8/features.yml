openxr_spatial_container:
  title: OpenXR Spatial Container integration
  subtitle: subtitle
  text: |
    Godot 4.8 grows in XR capabilities with the integration of the new [OpenXR Spatial Containers extension](https://www.khronos.org/blog/openxr-spatial-containers): Spatial containers are system-managed spaces in which applications can display XR content, similar to how traditional applications draw 2D content within windows on a desktop.

    This new set of APIs evolves how XR applications are used and interacted with to allow for multiple multi-tasking and co-existing spatial contents. 
    In addition, the new capabilities lower the barrier of entry for developers to build new spatial apps and games, or port existing ones. Which is exactly what the Godot team, in collaboration with Blender Studio, did by porting Project Dogwalk.

  read_more: "/"
  contributors:
    - name: Fredia Huya-Kouadio
      link: https://github.com/m4gr3d
  media: openxr_spatial_container.webm
  poster: openxr_spatial_container_poster.webp

android_sdk_manager:
  title: Automate Android & Java SDK setup
  subtitle: subtitle
  text: |
    For developers targeting the Android platform, setting up and configuring the Android and Java SDK dependencies has been a much common and much reviled pain point.
    Well fear no more! Godot 4.8 introduces the Android SDK manager, which is used to automate the download, setup and management of the Android and Java SDK directly in the Godot editor.
  read_more: https://github.com/godotengine/godot/pull/121849
  contributors:
    - name: Fredia Huya-Kouadio
      link: https://github.com/m4gr3d
  media: android_sdk_manager.webp

